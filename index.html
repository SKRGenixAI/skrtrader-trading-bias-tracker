<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKR Trader - Advanced Trading Bias Tracker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;color:#333}.container{max-width:1200px;margin:0 auto}.header{text-align:center;margin-bottom:40px;color:#fff}.logo{font-size:48px;margin-bottom:10px}.title{font-size:32px;font-weight:700;margin-bottom:5px}.subtitle{font-size:14px;opacity:.9}.input-section{background:#fff;padding:20px;border-radius:12px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.input-group{display:flex;gap:10px}.input-group input{flex:1;padding:12px 15px;border:2px solid #ddd;border-radius:8px;font-size:14px;transition:border-color .3s}.input-group input:focus{outline:none;border-color:#667eea}.input-group button{padding:12px 30px;background:#667eea;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .3s}.input-group button:hover{background:#764ba2;transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)}.pairs-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:20px}.pair-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2);border-left:4px solid #667eea;transition:all .3s}.pair-card:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(0,0,0,.3)}.pair-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pair-name{font-size:24px;font-weight:700;color:#333}.delete-btn{background:#e74c3c;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .3s}.delete-btn:hover{background:#c0392b;transform:scale(1.05)}.timeframes-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.timeframe-row{display:contents}.timeframe-label{grid-column:1/-1;font-size:12px;font-weight:600;color:#666;margin-top:10px;margin-bottom:5px}.timeframe-label:first-child{margin-top:0}.button-group{display:flex;gap:8px}.timeframe-btn{flex:1;padding:10px;border:2px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;transition:all .3s;min-height:40px;display:flex;align-items:center;justify-content:center}.timeframe-btn:hover{border-color:#667eea}.timeframe-btn.bullish{background:#2ecc71;color:#fff;border-color:#27ae60}.timeframe-btn.bearish{background:#e74c3c;color:#fff;border-color:#c0392b}.empty{text-align:center;padding:40px 20px;color:#999;grid-column:1/-1}.empty p{font-size:16px}</style></head><body><div class="container"><div class="header"><div class="logo">📊</div><div class="title">SKR TRADER</div><div class="subtitle">Professional Trading Bias Tracker</div></div><div class="input-section"><div class="input-group"><input type="text" id="pairInput" placeholder="BTC, ETH, GOLD, USD/JPY" /><button onclick="addPair()">+ Add</button></div></div><div class="pairs-container" id="pairsContainer"></div></div><script>const timeframes=['1m','3m','5m','10m','15m','30m','45m','1h','2h','4h','1D','1W','1M'];const defaultPairs=['BTC','ETH','GOLD','USD/JPY','EURUSD','XAUUSD','GBPUSD'];const storageKey='tradingPairs';function initializePairs(){let pairs=JSON.parse(localStorage.getItem(storageKey))||[];if(pairs.length===0){pairs=defaultPairs.map(p=>({name:p,states:{}}));}localStorage.setItem(storageKey,JSON.stringify(pairs));renderPairs();}function renderPairs(){const container=document.getElementById('pairsContainer');const pairs=JSON.parse(localStorage.getItem(storageKey))||[];container.innerHTML='';if(pairs.length===0){container.innerHTML='<div class="empty"><p>No trading pairs added yet</p></div>';return;}pairs.forEach((pair,idx)=>{const pairDiv=document.createElement('div');pairDiv.className='pair-card';let html=`<div class="pair-header"><div class="pair-name">${pair.name}</div><button class="delete-btn" onclick="deletePair(${idx})">Delete</button></div><div class="timeframes-grid">`;const timeframesPerRow=5;for(let i=0;i<timeframes.length;i++){const tf=timeframes[i];const state=pair.states[tf]||'none';html+=`<div class="button-group"><button class="timeframe-btn ${state}" data-pair="${pair.name}" data-timeframe="${tf}" onclick="toggleBullish('${pair.name}','${tf}')" title="Bullish">Bull</button><button class="timeframe-btn ${state===`bullish`?``:state}" data-pair="${pair.name}" data-timeframe="${tf}" onclick="toggleBearish('${pair.name}','${tf}')" title="Bearish">Bear</button></div>`;}html+='</div>';pairDiv.innerHTML=html;container.appendChild(pairDiv);});}function addPair(){const input=document.getElementById('pairInput');const pairName=input.value.trim().toUpperCase();if(!pairName){alert('Please enter a pair name');return;}const pairs=JSON.parse(localStorage.getItem(storageKey))||[];if(pairs.some(p=>p.name===pairName)){alert('Pair already exists');return;}pairs.push({name:pairName,states:{}});localStorage.setItem(storageKey,JSON.stringify(pairs));input.value='';renderPairs();}function deletePair(idx){const pairs=JSON.parse(localStorage.getItem(storageKey))||[];pairs.splice(idx,1);localStorage.setItem(storageKey,JSON.stringify(pairs));renderPairs();}function toggleBullish(pairName,tf){const pairs=JSON.parse(localStorage.getItem(storageKey))||[];const pair=pairs.find(p=>p.name===pairName);if(!pair)return;if(pair.states[tf]==='bullish'){pair.states[tf]='none';}else{pair.states[tf]='bullish';}localStorage.setItem(storageKey,JSON.stringify(pairs));renderPairs();}function toggleBearish(pairName,tf){const pairs=JSON.parse(localStorage.getItem(storageKey))||[];const pair=pairs.find(p=>p.name===pairName);if(!pair)return;if(pair.states[tf]==='bearish'){pair.states[tf]='none';}else{pair.states[tf]='bearish';}localStorage.setItem(storageKey,JSON.stringify(pairs));renderPairs();}initializePairs();</script></body></html>
