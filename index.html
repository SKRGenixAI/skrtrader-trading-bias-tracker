<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKR Trader - Trading Bias Tracker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI';background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:1200px;margin:0 auto}header{text-align:center;color:#fff;margin-bottom:30px}header h1{font-size:2.5em}header p{font-size:1.1em;opacity:0.9}.input-section{background:#fff;padding:20px;border-radius:12px;margin-bottom:30px;display:flex;gap:10px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,0.3)}.input-section input{flex:1;min-width:200px;padding:12px 15px;border:2px solid #e0e0e0;border-radius:8px}.input-section input:focus{outline:0;border-color:#667eea}.input-section button{padding:12px 30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.pairs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px}.pair-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}.pair-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #f0f0f0}.pair-name{font-size:1.3em;font-weight:bold}.delete-btn{background:#ff6b6b;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}.timeframes{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px}.timeframe-group{display:flex;flex-direction:column;gap:4px}.timeframe-label{font-size:0.75em;color:#666;text-align:center;font-weight:bold}.buttons-row{display:flex;gap:4px}.bias-btn{flex:1;padding:8px;border:2px solid #ddd;border-radius:6px;cursor:pointer;font-weight:bold;background:#fff}.bias-btn.bullish.active{background:#4CAF50;color:#fff;border-color:#4CAF50}.bias-btn.bearish.active{background:#f44336;color:#fff;border-color:#f44336}.empty-state{text-align:center;color:#fff;padding:40px}</style></head><body><div class="container"><header><h1>📊 SKR TRADER</h1><p>Professional Trading Bias Tracker</p></header><div class="input-section"><input type="text" id="pairInput" placeholder="BTC, ETH, GOLD, USD/JPY" /><button onclick="addPair()">+ Add</button></div><div id="pairsContainer" class="pairs-grid"></div><div id="emptyState" class="empty-state"><p>Add your first trading pair to get started! 🚀</p></div></div><script>const TIMEFRAMES=['1m','3m','5m','10m','15m','30m','45m','1h','2h','4h','1D','1W','1M'];const SK='skrTraderPairs';function loadPairs(){const s=localStorage.getItem(SK);return s?JSON.parse(s):{}}function savePairs(p){localStorage.setItem(SK,JSON.stringify(p))}function addPair(){const i=document.getElementById('pairInput');const n=i.value.trim().toUpperCase();if(!n){alert('Enter pair');return}const p=loadPairs();if(p[n]){alert('Exists');return}p[n]={};TIMEFRAMES.forEach(t=>{p[n][t]=null});savePairs(p);i.value='';renderPairs()}function deletePair(n){if(confirm('Delete '+n+'?')){const p=loadPairs();delete p[n];savePairs(p);renderPairs()}}function toggleBias(n,t,b){const p=loadPairs();p[n][t]===b?p[n][t]=null:p[n][t]=b;savePairs(p);renderPairs()}function renderPairs(){const p=loadPairs();const c=document.getElementById('pairsContainer');const e=document.getElementById('emptyState');c.innerHTML='';if(Object.keys(p).length===0){e.style.display='block';return}e.style.display='none';Object.entries(p).forEach(([n,d])=>{const cd=document.createElement('div');cd.className='pair-card';const h=document.createElement('div');h.className='pair-header';h.innerHTML='<div class="pair-name">'+n+'</div><button class="delete-btn" onclick="deletePair(\''+n+'\')\" >Delete</button>';const tf=document.createElement('div');tf.className='timeframes';TIMEFRAMES.forEach(tm=>{const g=document.createElement('div');g.className='timeframe-group';const l=document.createElement('div');l.className='timeframe-label';l.textContent=tm;const b=document.createElement('div');b.className='buttons-row';const cb=d[tm];const bb=document.createElement('button');bb.className='bias-btn bullish'+(cb==='B'?' active':'');bb.textContent='B';bb.onclick=()=>toggleBias(n,tm,'B');const rb=document.createElement('button');rb.className='bias-btn bearish'+(cb==='R'?' active':'');rb.textContent='R';rb.onclick=()=>toggleBias(n,tm,'R');b.appendChild(bb);b.appendChild(rb);g.appendChild(l);g.appendChild(b);tf.appendChild(g)});cd.appendChild(h);cd.appendChild(tf);c.appendChild(cd)})}document.getElementById('pairInput').addEventListener('keypress',function(e){if(e.key==='Enter')addPair()});renderPairs();</script></body></html>
