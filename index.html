<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKR Trader - Advanced Trading Bias Tracker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:1400px;margin:0 auto}header{text-align:center;color:#fff;margin-bottom:30px}header h1{font-size:2.8em;font-weight:bold;margin-bottom:5px;letter-spacing:1px}header p{font-size:1.15em;opacity:0.95;font-weight:300}.input-section{background:#fff;padding:25px;border-radius:15px;margin-bottom:35px;display:flex;gap:12px;flex-wrap:wrap;box-shadow:0 15px 40px rgba(0,0,0,0.25)}.input-section input{flex:1;min-width:250px;padding:14px 18px;border:2px solid #e0e0e0;border-radius:10px;font-size:1em;transition:all 0.3s}.input-section input:focus{outline:0;border-color:#667eea;box-shadow:0 0 15px rgba(102,126,234,0.2)}.input-section button{padding:14px 35px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;transition:all 0.3s;box-shadow:0 4px 15px rgba(102,126,234,0.3)}.input-section button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,0.4)}.pairs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:25px}.pair-card{background:#fff;border-radius:15px;padding:25px;box-shadow:0 15px 40px rgba(0,0,0,0.15);transition:all 0.3s;border-left:5px solid #667eea}.pair-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,0,0,0.25)}.pair-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #f5f5f5}.pair-name{font-size:1.5em;font-weight:bold;color:#333;letter-spacing:0.5px}.delete-btn{background:#ff6b6b;color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:0.9em;transition:all 0.3s;font-weight:600}.delete-btn:hover{background:#ff5252;transform:scale(1.05)}.timeframes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:15px}.timeframe-group{display:flex;flex-direction:column;gap:8px}.timeframe-label{font-size:0.85em;color:#999;text-align:center;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px}.buttons-row{display:flex;gap:6px}.bias-btn{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.85em;transition:all 0.2s;background:#fff;color:#666;text-transform:uppercase;letter-spacing:0.3px}.bias-btn:hover{transform:scale(1.08);border-color:#999}.bias-btn.bullish.active{background:#2ecc71;color:#fff;border-color:#27ae60;box-shadow:0 5px 15px rgba(46,204,113,0.3);font-weight:bold}.bias-btn.bearish.active{background:#e74c3c;color:#fff;border-color:#c0392b;box-shadow:0 5px 15px rgba(231,76,60,0.3);font-weight:bold}.empty-state{text-align:center;color:#fff;padding:50px;font-size:1.2em}@media (max-width:768px){.pairs-grid{grid-template-columns:1fr}}</style></head><body><div class="container"><header><h1>📊 SKR TRADER</h1><p>Professional Trading Bias Tracker</p></header><div class="input-section"><input type="text" id="pairInput" placeholder="Enter trading pair (BTC, ETH, XAUUSD, etc)" /><button onclick="addPair()">+ Add Pair</button></div><div id="pairsContainer" class="pairs-grid"></div><div id="emptyState" class="empty-state"><p>Add trading pairs to get started! 🚀</p></div></div><script>const TIMEFRAMES=['1m','3m','5m','10m','15m','30m','45m','1h','2h','4h','1D','1W','1M'];const SK='skrTrader';const DEFAULT_PAIRS=['BTC','ETH','GOLD','USD/JPY','EURUSD','XAUUSD','GBPUSD'];function loadPairs(){const s=localStorage.getItem(SK);return s?JSON.parse(s):{}}function savePairs(p){localStorage.setItem(SK,JSON.stringify(p))}function initializePairs(){const p=loadPairs();if(Object.keys(p).length===0){DEFAULT_PAIRS.forEach(pair=>{p[pair]={};TIMEFRAMES.forEach(tf=>{p[pair][tf]=null})});savePairs(p)}}function addPair(){const i=document.getElementById('pairInput');const n=i.value.trim().toUpperCase();if(!n){alert('Enter pair');return}const p=loadPairs();if(p[n]){alert('Already exists');return}p[n]={};TIMEFRAMES.forEach(t=>{p[n][t]=null});savePairs(p);i.value='';renderPairs()}function deletePair(n){if(confirm('Delete '+n+'?')){const p=loadPairs();delete p[n];savePairs(p);renderPairs()}}function toggleBias(n,t,b){const p=loadPairs();p[n][t]===b?p[n][t]=null:p[n][t]=b;savePairs(p);renderPairs()}function renderPairs(){const p=loadPairs();const c=document.getElementById('pairsContainer');const e=document.getElementById('emptyState');c.innerHTML='';if(Object.keys(p).length===0){e.style.display='block';return}e.style.display='none';Object.entries(p).forEach(([n,d])=>{const cd=document.createElement('div');cd.className='pair-card';const h=document.createElement('div');h.className='pair-header';h.innerHTML='<div class="pair-name">'+n+'</div><button class="delete-btn" onclick="deletePair(\''+n+'\')\" >Delete</button>';const tf=document.createElement('div');tf.className='timeframes';TIMEFRAMES.forEach(tm=>{const g=document.createElement('div');g.className='timeframe-group';const l=document.createElement('div');l.className='timeframe-label';l.textContent=tm;const b=document.createElement('div');b.className='buttons-row';const cb=d[tm];const bb=document.createElement('button');bb.className='bias-btn bullish'+(cb==='B'?' active':'');bb.textContent='Bull';bb.onclick=()=>toggleBias(n,tm,'B');const rb=document.createElement('button');rb.className='bias-btn bearish'+(cb==='R'?' active':'');rb.textContent='Bear';rb.onclick=()=>toggleBias(n,tm,'R');b.appendChild(bb);b.appendChild(rb);g.appendChild(l);g.appendChild(b);tf.appendChild(g)});cd.appendChild(h);cd.appendChild(tf);c.appendChild(cd)})}document.getElementById('pairInput').addEventListener('keypress',function(e){if(e.key==='Enter')addPair()});initializePairs();renderPairs();</script></body></html>
