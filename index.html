<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKR Trader - Advanced Trading Bias Tracker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;overflow-x:hidden}@keyframes bubbleFloat{0%{transform:translateY(100vh) translateX(0) scale(1);opacity:1}100%{transform:translateY(-100vh) translateX(100px) scale(0.5);opacity:0}}.bubble{position:fixed;border-radius:50%;background:rgba(255,255,255,0.1);pointer-events:none;animation:bubbleFloat linear forwards}.container{max-width:1400px;margin:0 auto}.header{text-align:center;margin-bottom:40px;color:white}.header h1{font-size:48px;margin:20px 0;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}.header p{font-size:18px;opacity:0.9}.input-section{display:flex;gap:15px;margin-bottom:40px;background:rgba(255,255,255,0.95);padding:20px;border-radius:15px;box-shadow:0 8px 32px rgba(0,0,0,0.1)}.input-section input{flex:1;padding:15px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;transition:border-color 0.3s}.input-section input:focus{outline:none;border-color:#667eea}.input-section button{padding:15px 30px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s}.input-section button:hover{background:#764ba2}.pairs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.pair-card{background:white;border-radius:12px;padding:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);position:relative}.pair-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.pair-name{font-size:18px;font-weight:700;color:#333}.delete-btn{background:#e74c3c;color:white;border:none;padding:8px 15px;border-radius:6px;cursor:pointer;font-size:13px}.timeframe-group{margin-bottom:12px}.timeframe-label{font-size:10px;font-weight:700;color:#667eea;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.timeframe-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}.tf-name{font-size:11px;color:#666;width:30px;text-align:right}.timeframe-btn{flex:1;padding:8px;border:1px solid #ddd;background:#f5f5f5;color:#333;cursor:pointer;border-radius:6px;font-size:11px;font-weight:600}.timeframe-btn.bullish{background:#2ecc71;color:white;border-color:#27ae60}.timeframe-btn.bearish{background:#e74c3c;color:white;border-color:#c0392b}</style></head><body><div class="container"><div class="header"><div style="font-size:60px;margin-bottom:10px">📊</div><h1>SKR TRADER</h1><p>Professional Trading Bias Tracker</p></div><div class="input-section"><input type="text" id="pairInput" placeholder="Enter pair name (BTC, EUR/USD, etc.)"><button onclick="addPair()">+ Add</button></div><div class="pairs-grid" id="pairsContainer"></div></div><script>const DEFAULT_PAIRS=['BTC','ETH','GOLD','USD/JPY','EURUSD','XAUUSD','GBPUSD'];const TIMEFRAMES=[{group:'MINUTES',frames:['1m','3m','5m','10m','15m']},{group:'EXTENDED',frames:['30m','45m','1h','2h','4h']},{group:'DAILY/WEEKLY/MONTHLY',frames:['1D','1W','1M']}];function createBubble(){const bubble=document.createElement('div');bubble.className='bubble';const size=Math.random()*100+20;bubble.style.width=size+'px';bubble.style.height=size+'px';const left=Math.random()*window.innerWidth;bubble.style.left=left+'px';bubble.style.bottom='-50px';const duration=Math.random()*15+10;bubble.style.animationDuration=duration+'s';document.body.appendChild(bubble);setTimeout(()=>bubble.remove(),duration*1000)}setInterval(createBubble,2000);function loadPairs(){const stored=localStorage.getItem('tradingPairs');if(stored){try{const pairs=JSON.parse(stored);if(Array.isArray(pairs)&&pairs.length>0){return pairs}}catch(e){}}return DEFAULT_PAIRS}function savePairs(){const pairs=Array.from(document.querySelectorAll('.pair-card')).map(card=>card.dataset.pair);localStorage.setItem('tradingPairs',JSON.stringify(pairs))}function toggleButton(pairName,timeframe,type){const pair=document.getElementById('pair-'+pairName);if(!pair)return;const buttons=pair.querySelectorAll(`.timeframe-btn[data-tf="${timeframe}"]`);buttons.forEach(btn=>{if(btn.dataset.type===type){if(btn.classList.contains(type==='bull'?'bullish':'bearish')){btn.classList.remove(type==='bull'?'bullish':'bearish')}else{buttons.forEach(b=>b.classList.remove('bullish','bearish'));btn.classList.add(type==='bull'?'bullish':'bearish')}}});savePairs()}function renderPairs(){const container=document.getElementById('pairsContainer');container.innerHTML='';const pairs=loadPairs();pairs.forEach(pair=>{const card=document.createElement('div');card.className='pair-card';card.dataset.pair=pair;card.id='pair-'+pair;let html=`<div class="pair-header"><div class="pair-name">${pair}</div><button class="delete-btn" onclick="deletePair('${pair}')">Delete</button></div>`;TIMEFRAMES.forEach(group=>{html+=`<div class="timeframe-group"><div class="timeframe-label">${group.group}</div>`;group.frames.forEach(tf=>{html+=`<div class="timeframe-row"><div class="tf-name">${tf}</div><button class="timeframe-btn" data-tf="${tf}" data-type="bull" onclick="toggleButton('${pair}','${tf}','bull')">Bullish</button><button class="timeframe-btn" data-tf="${tf}" data-type="bear" onclick="toggleButton('${pair}','${tf}','bear')">Bearish</button></div>`});html+=`</div>`});card.innerHTML=html;container.appendChild(card)})}function addPair(){const input=document.getElementById('pairInput');const pair=input.value.trim().toUpperCase();if(pair){const pairs=loadPairs();if(!pairs.includes(pair)){pairs.push(pair);localStorage.setItem('tradingPairs',JSON.stringify(pairs));renderPairs()}input.value='';input.focus()}}function deletePair(pair){const pairs=loadPairs();const newPairs=pairs.filter(p=>p!==pair);localStorage.setItem('tradingPairs',JSON.stringify(newPairs));renderPairs()}document.addEventListener('DOMContentLoaded',renderPairs);document.getElementById('pairInput')?.addEventListener('keypress',e=>{if(e.key==='Enter'){addPair()}})</script></body></html>
