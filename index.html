<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKR Trader - Advanced Trading Bias Tracker</title><style>* { margin: 0; padding: 0; box-sizing: border-box } @keyframes float { 0%, 100% { transform: translateY(0px) } 50% { transform: translateY(-20px) } } @keyframes glow { 0% { box-shadow: 0 0 5px rgba(102, 126, 234, .5) } 50% { box-shadow: 0 0 20px rgba(102, 126, 234, .8) } 100% { box-shadow: 0 0 5px rgba(102, 126, 234, .5) } } @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } } @keyframes bubbleFloat { 0% { bottom: -10px; opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { bottom: 100vh; opacity: 0 } } .bubble { position: fixed; bottom: 0; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .8), rgba(102, 126, 234, .3)); border-radius: 50%; pointer-events: none; z-index: 1 } body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; position: relative; overflow-x: hidden } body::before { content: 'SKR'; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; font-weight: 900; color: rgba(255, 255, 255, .03); z-index: 0; pointer-events: none; white-space: nowrap } body::after { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 20% 50%, rgba(255, 107, 107, .1) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(100, 200, 255, .1) 0%, transparent 50%); pointer-events: none; z-index: 0 } .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1 } .header { text-align: center; margin-bottom: 40px; color: #fff; animation: fadeInUp .8s ease-out } .logo { font-size: 48px; margin-bottom: 10px; animation: float 3s ease-in-out infinite } .title { font-size: 32px; font-weight: 700; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0, 0, 0, .2) } .subtitle { font-size: 14px; opacity: .9 } .input-section { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); backdrop-filter: blur(10px); animation: fadeInUp .8s ease-out .2s both } .input-group { display: flex; gap: 10px } .input-group input { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: all .3s } .input-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, .1) } .input-group button { padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all .3s } .input-group button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, .3) } .pairs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(650px, 1fr)); gap: 20px } .pair-card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .15); animation: fadeInUp .8s ease-out } .pair-card h3 { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #333; display: flex; justify-content: space-between; align-items: center } .delete-btn { padding: 8px 16px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all .3s } .delete-btn:hover { background: #c0392b; transform: translateY(-1px) } .timeframe-group { margin-bottom: 20px } .timeframe-label { font-size: 12px; font-weight: 700; color: #667eea; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px } .timeframe-row { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 10px; margin-bottom: 10px; align-items: center } .tf-name { font-size: 13px; font-weight: 600; color: #555; text-align: left } .btn-group { display: flex; gap: 8px } .timeframe-btn { flex: 1; padding: 10px 12px; border: 2px solid #ddd; border-radius: 6px; background: #f8f9fa; color: #333; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; text-transform: uppercase; letter-spacing: .5px } .timeframe-btn.bullish { background: #2ecc71; color: #fff; border-color: #27ae60 } .timeframe-btn.bearish { background: #e74c3c; color: #fff; border-color: #c0392b } </style></head><body><div class="container"><div class="header"><div class="logo">📊</div><div class="title">SKR TRADER</div><div class="subtitle">Professional Trading Bias Tracker</div></div><div class="input-section"><div class="input-group"><input type="text" id="pairInput" placeholder="Enter pair name (BTC, EUR/USD, etc.)"><button onclick="addPair()">+ Add</button></div></div><div id="pairsContainer" class="pairs-container"></div></div><script>const TIMEFRAMES = ['1m', '3m', '5m', '10m', '15m', '30m', '45m', '1h', '2h', '4h', '1D', '1W', '1M']; const DEFAULT_PAIRS = ['BTC', 'ETH', 'GOLD', 'USD/JPY', 'EURUSD', 'XAUUSD', 'GBPUSD']; const TIMEFRAME_GROUPS = { 'MINUTES': ['1m', '3m', '5m', '10m', '15m'], 'EXTENDED': ['30m', '45m', '1h', '2h', '4h'], 'DAILY/WEEKLY/MONTHLY': ['1D', '1W', '1M'] }; function loadPairs() { const stored = localStorage.getItem('tradingPairs'); if (stored) { return JSON.parse(stored); } return DEFAULT_PAIRS.map(name => ({ name, timeframes: {} })); } function savePairs(pairs) { localStorage.setItem('tradingPairs', JSON.stringify(pairs)); renderPairs(); } function renderPairs() { const container = document.getElementById('pairsContainer'); const pairs = loadPairs(); container.innerHTML = pairs.map(pair => { let html = `<div class="pair-card" id="pair-${pair.name}"><h3>${pair.name}<button class="delete-btn" onclick="deletePair('${pair.name}')">Delete</button></h3>`; for (const [groupName, tfs] of Object.entries(TIMEFRAME_GROUPS)) { html += `<div class="timeframe-group"><div class="timeframe-label">${groupName}</div>`; for (const tf of tfs) { const state = pair.timeframes[tf] || null; const bullClass = state === 'bullish' ? 'bullish' : ''; const bearClass = state === 'bearish' ? 'bearish' : ''; html += `<div class="timeframe-row"><div class="tf-name">${tf}</div><div class="btn-group"><button class="timeframe-btn ${bullClass}" data-pair="${pair.name}" data-tf="${tf}" data-type="bullish" onclick="toggleBias('${pair.name}', '${tf}', 'bullish')">BULL</button><button class="timeframe-btn ${bearClass}" data-pair="${pair.name}" data-tf="${tf}" data-type="bearish" onclick="toggleBias('${pair.name}', '${tf}', 'bearish')">BEAR</button></div></div>`; } html += `</div>`; } html += `</div>`; return html; }).join(''); createBubbles(); } function toggleBias(pairName, timeframe, type) { let pairs = loadPairs(); const pair = pairs.find(p => p.name === pairName); if (!pair) return; if (pair.timeframes[timeframe] === type) { pair.timeframes[timeframe] = null; } else { pair.timeframes[timeframe] = type; } savePairs(pairs); } function addPair() { const input = document.getElementById('pairInput'); const pairName = input.value.trim().toUpperCase(); if (!pairName) return; let pairs = loadPairs(); if (!pairs.find(p => p.name === pairName)) { pairs.push({ name: pairName, timeframes: {} }); savePairs(pairs); } input.value = ''; } function deletePair(pairName) { let pairs = loadPairs(); pairs = pairs.filter(p => p.name !== pairName); savePairs(pairs); } function createBubbles() { const bubbleCount = 12; for (let i = 0; i < bubbleCount; i++) { const bubble = document.createElement('div'); bubble.className = 'bubble'; const size = Math.random() * 100 + 30; bubble.style.width = size + 'px'; bubble.style.height = size + 'px'; bubble.style.left = Math.random() * 100 + '%'; bubble.style.animationDuration = (Math.random() * 20 + 15) + 's'; bubble.style.animationDelay = Math.random() * 5 + 's'; bubble.style.animation = 'bubbleFloat linear infinite'; document.body.appendChild(bubble); } } renderPairs(); </script></body></html>
