<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SKR Trader - Advanced Trading Bias Tracker</title><style>*{margin:0;padding:0;box-sizing:border-box}@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-20px)}}@keyframes glow{0%{box-shadow:0 0 5px rgba(102,126,234,.5)}50%{box-shadow:0 0 20px rgba(102,126,234,.8)}100%{box-shadow:0 0 5px rgba(102,126,234,.5)}}@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes bubbleFloat{0%{bottom:-10px;opacity:0}10%{opacity:1}90%{opacity:1}100%{bottom:100vh;opacity:0}}.bubble{position:fixed;bottom:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(102,126,234,.3));border-radius:50%;pointer-events:none;z-index:1}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;color:#333;position:relative;overflow-x:hidden}body::before{content:'SKR';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:150px;font-weight:900;color:rgba(255,255,255,.03);z-index:0;pointer-events:none;white-space:nowrap}body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 20% 50%,rgba(255,107,107,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(100,200,255,.1) 0%,transparent 50%);pointer-events:none;z-index:0}.container{max-width:1400px;margin:0 auto;position:relative;z-index:1}.header{text-align:center;margin-bottom:40px;color:#fff;animation:fadeInUp .8s ease-out}.logo{font-size:48px;margin-bottom:10px;animation:float 3s ease-in-out infinite}.title{font-size:32px;font-weight:700;margin-bottom:5px;text-shadow:0 2px 10px rgba(0,0,0,.2)}.subtitle{font-size:14px;opacity:.9}.input-section{background:#fff;padding:20px;border-radius:12px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(10px);animation:fadeInUp .8s ease-out .2s both}.input-group{display:flex;gap:10px}.input-group input{flex:1;padding:12px 15px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;transition:all .3s;background:rgba(255,255,255,.9);outline:none}.input-group input:focus{border-color:#667eea;background:#fff;box-shadow:0 0 10px rgba(102,126,234,.4)}.input-group button{padding:12px 30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .3s;animation:glow 2s ease-in-out infinite;outline:none}.input-group button:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(102,126,234,.6)}.pairs-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:20px}.pair-card{background:#fff;border-radius:12px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.2);border-left:5px solid #667eea;transition:all .3s;backdrop-filter:blur(10px);min-height:auto;overflow:hidden;animation:fadeInUp .6s ease-out}.pair-card:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(0,0,0,.3);border-left-color:#764ba2}.pair-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #f0f0f0}.pair-name{font-size:24px;font-weight:700;color:#333}.delete-btn{background:#e74c3c;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .3s;outline:none}.delete-btn:hover{background:#c0392b;transform:scale(1.1);box-shadow:0 4px 12px rgba(231,76,60,.4)}.timeframes-grid{display:grid;grid-template-columns:1fr;gap:0}.timeframe-group{border-top:1px solid #e0e0e0;padding-top:12px;margin-top:12px}.timeframe-group:first-child{border-top:none;margin-top:0;padding-top:0}.group-label{font-size:11px;font-weight:700;color:#667eea;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #f0f0f0}.timeframe-row{display:grid;grid-template-columns:35px auto;gap:8px;align-items:center;margin-bottom:8px}.timeframe-label{font-size:12px;font-weight:600;color:#555;text-align:center;min-width:35px;padding:4px 0}.buttons-wrapper{display:grid;grid-template-columns:1fr 1fr;gap:4px}.timeframe-btn{padding:8px 6px;border:2px solid #ddd;background:#fff;border-radius:5px;cursor:pointer;font-weight:600;font-size:9px;transition:all .2s;min-height:30px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}.timeframe-btn:hover{border-color:#667eea;transform:scale(1.05);box-shadow:0 2px 8px rgba(102,126,234,.2)}.timeframe-btn:focus{outline:none}.timeframe-btn.bullish{background:#2ecc71;color:#fff;border-color:#27ae60;box-shadow:0 4px 12px rgba(46,204,113,.4)}.timeframe-btn.bearish{background:#e74c3c;color:#fff;border-color:#c0392b;box-shadow:0 4px 12px rgba(231,76,60,.4)}.empty{text-align:center;padding:40px 20px;color:#999;grid-column:1/-1}.empty p{font-size:16px}@media(max-width:768px){.pairs-container{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="header"><div class="logo">📊</div><div class="title">SKR TRADER</div><div class="subtitle">Professional Trading Bias Tracker</div></div><div class="input-section"><div class="input-group"><input type="text" id="pairInput" placeholder="Enter pair name (BTC, EUR/USD, etc.)"><button onclick="addPair()">+ Add</button></div></div><div class="pairs-container" id="pairsContainer"></div></div><script>const timeframes=['1m','3m','5m','10m','15m','30m','45m','1h','2h','4h','1D','1W','1M'];const defaultPairs=['BTC','ETH','GOLD','USD/JPY','EURUSD','XAUUSD','GBPUSD'];const storageKey='tradingPairs';const timeframeGroups=[{name:'MINUTES',frames:['1m','3m','5m','10m','15m']},{name:'EXTENDED',frames:['30m','45m','1h','2h','4h']},{name:'DAILY/WEEKLY/MONTHLY',frames:['1D','1W','1M']}];function createBubbles(){const count=8;for(let i=0;i<count;i++){const bubble=document.createElement('div');bubble.className='bubble';const size=Math.random()*60+20;bubble.style.width=size+'px';bubble.style.height=size+'px';bubble.style.left=Math.random()*100+'%';const duration=Math.random()*8+6;bubble.style.animation=`bubbleFloat ${duration}s ease-in infinite`;bubble.style.animationDelay=Math.random()*2+'s';document.body.appendChild(bubble);}setInterval(()=>{const bubble=document.createElement('div');bubble.className='bubble';const size=Math.random()*60+20;bubble.style.width=size+'px';bubble.style.height=size+'px';bubble.style.left=Math.random()*100+'%';const duration=Math.random()*8+6;bubble.style.animation=`bubbleFloat ${duration}s ease-in infinite`;document.body.appendChild(bubble);setTimeout(()=>bubble.remove(),duration*1000);},3000);}function initializePairs(){let pairs=JSON.parse(localStorage.getItem(storageKey))||[];if(pairs.length===0){pairs=defaultPairs.map(p=>({name:p,states:{}}));}localStorage.setItem(storageKey,JSON.stringify(pairs));renderPairs();}function renderPairs(){const container=document.getElementById('pairsContainer');const pairs=JSON.parse(localStorage.getItem(storageKey))||[];container.innerHTML='';if(pairs.length===0){container.innerHTML='<div class="empty"><p>No trading pairs added yet</p></div>';return;}pairs.forEach((pair,idx)=>{const pairDiv=document.createElement('div');pairDiv.className='pair-card';pairDiv.id=`pair-${pair.name}`;let html=`<div class="pair-header"><div class="pair-name">${pair.name}</div><button class="delete-btn" onclick="deletePair(${idx})">Delete</button></div><div class="timeframes-grid">`;timeframeGroups.forEach(group=>{html+=`<div class="timeframe-group"><div class="group-label">${group.name}</div>`;group.frames.forEach(tf=>{const state=pair.states[tf]||'none';const bullishClass=state==='bullish'?'bullish':'';const bearishClass=state==='bearish'?'bearish':'';html+=`<div class="timeframe-row"><div class="timeframe-label">${tf}</div><div class="buttons-wrapper"><button class="timeframe-btn ${bullishClass}" data-pair="${pair.name}" data-tf="${tf}" data-type="bullish" onclick="updateState('${pair.name}','${tf}','bullish')">BULL</button><button class="timeframe-btn ${bearishClass}" data-pair="${pair.name}" data-tf="${tf}" data-type="bearish" onclick="updateState('${pair.name}','${tf}','bearish')">BEAR</button></div></div>`;});html+='</div>';});html+='</div>';pairDiv.innerHTML=html;container.appendChild(pairDiv);});}function updateState(pairName,tf,newState){const pairs=JSON.parse(localStorage.getItem(storageKey))||[];const pair=pairs.find(p=>p.name===pairName);if(!pair)return;if(pair.states[tf]===newState){pair.states[tf]='none';}else{pair.states[tf]=newState;}localStorage.setItem(storageKey,JSON.stringify(pairs));updateButtonsOnly(pairName,tf,pair.states[tf]);}function updateButtonsOnly(pairName,tf,state){const pairCard=document.getElementById(`pair-${pairName}`);if(!pairCard)return;const buttons=pairCard.querySelectorAll(`.timeframe-btn[data-tf="${tf}"]`);buttons.forEach(btn=>{btn.classList.remove('bullish','bearish');if(btn.dataset.type===state){btn.classList.add(state);}});}function addPair(){const input=document.getElementById('pairInput');const pairName=input.value.trim().toUpperCase();if(!pairName){alert('Please enter a pair name');return;}const pairs=JSON.parse(localStorage.getItem(storageKey))||[];if(pairs.some(p=>p.name===pairName)){alert('Pair already exists');return;}pairs.push({name:pairName,states:{}});localStorage.setItem(storageKey,JSON.stringify(pairs));input.value='';renderPairs();}function deletePair(idx){const pairs=JSON.parse(localStorage.getItem(storageKey))||[];pairs.splice(idx,1);localStorage.setItem(storageKey,JSON.stringify(pairs));renderPairs();}createBubbles();initializePairs();</script></body></html>
