<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKR Trader - Trading Bias Tracker & Economic Calendar</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0f1419;color:#fff;overflow-x:hidden}@keyframes float{0%{transform:translateY(100vh) translateX(0) scale(1);opacity:1}100%{transform:translateY(-100vh) translateX(100px) scale(.5);opacity:0}}.bubble{position:fixed;width:80px;height:80px;border-radius:50%;background:rgba(102,126,234,.08);animation:float linear forwards;pointer-events:none;z-index:1}header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}nav{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:600;padding:8px 16px;border-radius:6px;transition:.3s;border-bottom:3px solid transparent}nav a.active{border-bottom-color:#ffd700;background:rgba(0,0,0,.2)}nav a:hover{background:rgba(0,0,0,.1)}.container{max-width:1400px;margin:0 auto;padding:20px}.tab-content{display:none}#tracker-tab{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.pair-card{background:#1a1f2e;border-radius:12px;padding:15px;box-shadow:0 4px 15px rgba(0,0,0,.3)}.pair-name{font-size:18px;font-weight:700;margin-bottom:15px;display:flex;justify-content:space-between}.delete-btn{background:#e74c3c;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}.tf-group{margin-bottom:15px}.tf-label{font-size:10px;font-weight:700;color:#667eea;text-transform:uppercase;margin-bottom:8px}.tf-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}.tf-name{width:35px;font-size:11px;color:#aaa}.btn{flex:1;padding:8px;border:1px solid #333;background:#2a3142;color:#fff;cursor:pointer;border-radius:6px;font-size:11px;font-weight:600;transition:.2s}.btn.bull{background:#2ecc71;border-color:#27ae60}.btn.bear{background:#e74c3c;border-color:#c0392b}.btn:hover{opacity:.8}.input-section{display:flex;gap:15px;margin-bottom:30px;background:#1a1f2e;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.3)}#pairInput{flex:1;padding:12px;background:#2a3142;border:1px solid #333;color:#fff;border-radius:6px;font-size:14px}#pairInput::placeholder{color:#666}#addBtn{padding:12px 30px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;transition:.3s}#addBtn:hover{background:#764ba2}.calendar-container{display:grid;grid-template-columns:1fr;gap:20px}.event{background:#1a1f2e;padding:15px;border-radius:12px;border-left:4px solid #667eea;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.3)}.event.high{border-left-color:#e74c3c}.event.medium{border-left-color:#f39c12}.event.low{border-left-color:#2ecc71}.event-info{flex:1}.event-time{font-size:12px;color:#aaa;margin-bottom:5px}.event-title{font-size:14px;font-weight:600;margin-bottom:5px}.event-impact{display:inline-block;font-size:10px;padding:4px 8px;border-radius:4px;margin-right:8px;font-weight:600}.impact-high{background:#e74c3c;color:#fff}.impact-medium{background:#f39c12;color:#fff}.impact-low{background:#2ecc71;color:#fff}.pairs-affected{font-size:11px;color:#667eea;margin-top:5px}.countdown{text-align:right;font-size:14px;font-weight:600;color:#ffd700}.news-card{background:#1a1f2e;padding:15px;border-radius:12px;border-top:3px solid;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.3)}.news-card.critical{border-top-color:#e74c3c}.news-card.major{border-top-color:#f39c12}.news-headline{font-size:14px;font-weight:600;margin-bottom:8px}.news-summary{font-size:12px;color:#aaa;margin-bottom:10px}.news-meta{display:flex;gap:10px;font-size:11px}.news-alert{display:inline-block;background:#e74c3c;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600}.news-pairs{color:#667eea}.disclaimer{background:#2a3142;padding:15px;border-radius:12px;font-size:12px;color:#aaa;margin-top:30px;border-left:4px solid #667eea}</style></head><body><script>setInterval(()=>{const b=document.createElement('div');b.className='bubble';const s=Math.random()*80+40;b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*window.innerWidth+'px';b.style.animationDuration=Math.random()*10+8+'s';document.body.appendChild(b);setTimeout(()=>b.remove(),15000)},1500)</script><header><nav><a href="#" onclick="showTab('tracker')" class="nav-link active" id="tracker-link">📊 Bias Tracker</a><a href="#" onclick="showTab('calendar')" class="nav-link" id="calendar-link">📅 Economic Calendar</a><a href="#" onclick="showTab('news')" class="nav-link" id="news-link">📰 Market News</a></nav></header><div class="container"><h1 style="text-align:center;margin:30px 0;font-size:36px">🚀 SKR TRADER</h1><div id="tracker-tab" class="tab-content"><div class="input-section"><input type="text" id="pairInput" placeholder="Enter pair (BTC, EUR/USD, etc.)"><button id="addBtn" onclick="addPair()">+ Add</button></div><div class="grid" id="pairsGrid"></div></div><div id="calendar-tab" class="tab-content"><h2 style="margin-bottom:20px">📅 High-Impact Economic Events</h2><div class="calendar-container" id="calendarEvents"></div></div><div id="news-tab" class="tab-content"><h2 style="margin-bottom:20px">📰 Market-Moving News</h2><div id="newsFeed"></div></div><div class="disclaimer">⚠️ <strong>Disclaimer:</strong> Trading involves significant risk. This tool is for educational purposes only. Not financial advice. Always use proper risk management.</div></div><script>const PAIRS=['BTC','ETH','GOLD','USD/JPY','EURUSD','XAUUSD','GBPUSD'];const TFS=[{group:'MINUTES',frames:['1m','3m','5m','10m','15m']},{group:'EXTENDED',frames:['30m','45m','1h','2h','4h']},{group:'DAILY/WEEKLY',frames:['1D','1W','1M']}];const EVENTS=[{time:'14:00',title:'Fed Interest Rate Decision',impact:'high',pairs:['EUR/USD','GBP/USD','AUD/USD'],countdown:120},{time:'16:30',title:'US CPI Release',impact:'high',pairs:['USD/JPY','EUR/USD','Gold'],countdown:270},{time:'Tomorrow 08:00',title:'NFP (Non-Farm Payroll)',impact:'high',pairs:['USD pairs','AUD/USD','NZD/USD'],countdown:1440}];const NEWS=[{headline:'Bitcoin Surges on Fed Policy Shift',summary:'BTC breaks above resistance on dovish Fed commentary',alert:'CRITICAL',pairs:'BTC, ETH, USD Pairs',time:'2 mins ago'},{headline:'EUR Falls Below 1.08 Level',summary:'European currency weakens on economic concerns',alert:'MAJOR',pairs:'EUR/USD, EUR/GBP',time:'15 mins ago'},{headline:'Gold Rally Continues',summary:'Safe-haven demand supports gold prices',alert:'MAJOR',pairs:'XAU/USD, USD/JPY',time:'1 hour ago'}];function showTab(e){document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none'),document.querySelectorAll('.nav-link').forEach(t=>t.classList.remove('active')),document.getElementById(e+'-tab').style.display='block',document.getElementById(e+'-link').classList.add('active')}function renderTracker(){const e=document.getElementById('pairsGrid');e.innerHTML='',PAIRS.forEach(t=>{const a=document.createElement('div');a.className='pair-card',a.innerHTML=`<div class="pair-name">${t}<button class="delete-btn" onclick="delPair('${t}')">Delete</button></div>`,TFS.forEach(r=>{a.innerHTML+=`<div class="tf-group"><div class="tf-label">${r.group}</div>${r.frames.map(i=>`<div class="tf-row"><div class="tf-name">${i}</div><button class="btn" onclick="toggle('${t}','${i}','bull')">BULL</button><button class="btn" onclick="toggle('${t}','${i}','bear')">BEAR</button></div>`).join('')}</div>`}),e.appendChild(a)})}function renderCalendar(){const e=document.getElementById('calendarEvents');e.innerHTML=EVENTS.map(t=>`<div class="event ${t.impact}"><div class="event-info"><div class="event-time">${t.time}</div><div class="event-title">${t.title}</div><span class="event-impact impact-${t.impact}">${t.impact.toUpperCase()}</span><div class="pairs-affected">Pairs: ${t.pairs.join(', ')}</div></div><div class="countdown">${t.countdown}m</div></div>`).join('')}function renderNews(){const e=document.getElementById('newsFeed');e.innerHTML=NEWS.map(t=>`<div class="news-card ${t.alert.toLowerCase()}"><div class="news-headline">${t.headline}</div><div class="news-summary">${t.summary}</div><div class="news-meta"><span class="news-alert">${t.alert}</span><span class="news-pairs">📍 ${t.pairs}</span><span>${t.time}</span></div></div>`).join('')}function addPair(){const e=document.getElementById('pairInput').value.trim().toUpperCase();e&&(PAIRS.includes(e)||(PAIRS.push(e),renderTracker()),document.getElementById('pairInput').value='')}function delPair(e){PAIRS=PAIRS.filter(t=>t!==e),renderTracker()}function toggle(e,t,a){}document.addEventListener('DOMContentLoaded',()=>{renderTracker(),renderCalendar(),renderNews(),setInterval(renderCalendar,60000)})</script></body></html>
